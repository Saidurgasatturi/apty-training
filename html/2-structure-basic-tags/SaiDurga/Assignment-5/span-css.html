<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Highlight Text</title>
  <style>
    .red {
        color: red;
        font-weight: bold;
    }
    .blue {
        color: blue;
    }
    .green {
        color: green; 
        font-style: italic; 
    }
  </style>
</head>
<body>
  <p>
    Learning <span class="red">HTML</span> and 
    <span class="blue">CSS</span> is the first step towards becoming a 
    <span class="green">great web developer</span>.
  </p>
</body>
</html>
