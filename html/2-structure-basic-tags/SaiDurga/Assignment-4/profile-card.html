<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <style>
    .card {
      width: 300px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 2px 2px 10px gray;
      background-color: aqua;
    }
    .card img {
      width: 100px;
      border-radius: 50%;
      
    }
    .name {
      font-size: 20px;
      font-weight: bold;
    }
    .bio {
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="mypic.jpeg" alt="Profile Picture">
    <div class="name">Sai Durga</div>
    <div class="bio">Hi, I'm Sai Durga! A web development enthusiast who loves coding and creating awesome projects.</div>
  </div>
</body>
</html>
