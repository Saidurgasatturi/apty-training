<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Timetable</title>
  <style>
    table, th, td {
      border: 1px solid black;; 
      padding: 8px;
      text-align: center;
    }
    form {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Class Timetable</h1>
  <table>
    <tr>
      <th>Day</th>
      <th>9-10</th>
      <th>10-11</th>
      <th>11-12</th>
    </tr>
    <tr>
      <td>Monday</td>
      <td>Math</td>
      <td>Science</td>
      <td>English</td>
    </tr>
    <tr>
      <td>Tuesday</td>
      <td>History</td>
      <td>Math</td>
      <td>Computer</td>
    </tr>
  </table>

  <h2>Login Form</h2>
  <form>
    <label>Username:</label>
    <input type="text" name="username" placeholder="Enter username" required><br><br>

    <label>Password:</label>
    <input type="password" name="password" placeholder="Enter password" required><br><br>

    <input type="submit" value="Login">
  </form>
</body>
</html>
