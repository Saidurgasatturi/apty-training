<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tech Insights - Contact</title>
  <meta name="description" content="Contact Apty.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
      color: #333;
    }
    header {
        background: #222;
        color: #fff;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 15px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 900px;
      margin: 20px auto 80px; /* space above footer */
      padding: 20px;
      background: #fff;
      border-radius: 8px;
    }
    form .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #222;
      color: #fff;
      border: none;
      padding: 12px 25px;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #444;
    }
    footer {
      text-align:center;
      background: #222;
      color: #fff;
      padding: 12px;
      position: fixed;
      bottom: 0;
      width:100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Apty</h1>
    <nav>
      <ul>
        <li><a href="multi-page-website.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contact Us</h2>
    <form>
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; All rights reserved.</p>
  </footer>
</body>
</html>
