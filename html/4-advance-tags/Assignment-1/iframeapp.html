<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Example</title>
</head>
<body>
  <h2>Embed YouTube Video</h2>
  <iframe 
    width="560" 
    height="315" 
    src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
    title="YouTube video player"
    frameborder="0" 
    allowfullscreen>
  </iframe>

  <h2>Embed Google Map</h2>
  <iframe 
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.1853543742806!2d-122.41941548468148!3d37.77492927975978!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808c5f0f3c65%3A0x4b8d1a38c0dd2c5e!2sSan%20Francisco!5e0!3m2!1sen!2sus!4v1695560911257" 
    width="600" 
    height="450" 
    style="border:0;" 
    allowfullscreen 
    loading="lazy">
  </iframe>
</body>
</html>
