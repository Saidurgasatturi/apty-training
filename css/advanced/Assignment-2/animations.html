<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation & Media Queries</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }
    .box {
      width: 150px;
      height: 150px;
      background: #3498db;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-50px);
      }
    }
    @media (max-width: 768px) {
      .box {
        width: 120px;
        height: 120px;
        font-size: 14px;
        background: #e67e22;
      }
    }

    @media (max-width: 480px) {
      .box {
        width: 90px;
        height: 90px;
        font-size: 12px;
        background: #2ecc71;
      }
    }
  </style>
</head>
<body>
  <div class="box">Hello Guys..!</div>
</body>
</html>
