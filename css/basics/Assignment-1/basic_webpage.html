<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic CSS</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
    }
    p {
      font-size: 18px;
    }
    .container {
      background-color: #f5f5f5;
      padding: 20px;
      align-items: center;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="main-heading">Welcome to My Webpage</h1>
    
    <p>This is a simple webpage demonstrating inline, internal, and external CSS styling.</p>

    <ul>
      <li style="color: blue;">This list item is styled using inline CSS</li>
      <li>Second list item</li>
      <li>Third list item</li>
    </ul>

    <img src="apty_image.png" alt="Sample Image of Apty">
  </div>
</body>
</html>
