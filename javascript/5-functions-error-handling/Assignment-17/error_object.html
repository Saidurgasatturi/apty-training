<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Object - Banking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🏦 Banking System - Withdraw Amount</h1>

  <div class="container">
    <label>Enter Account Balance:</label>
    <input type="number" id="balance" placeholder="Enter your balance">

    <label>Enter Withdrawal Amount:</label>
    <input type="number" id="withdraw" placeholder="Enter withdrawal amount">

    <button onclick="withdrawAmount()">Withdraw</button>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
