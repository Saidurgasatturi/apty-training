<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callback Functions with Default Parameters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Callback Function Example</h2>
    <p>Enter any text to process (default behavior: convert to uppercase):</p>

    <input type="text" id="userInput" placeholder="Enter your text here">

    <button onclick="processInput()">Process Text</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
