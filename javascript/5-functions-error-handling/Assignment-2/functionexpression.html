<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Numbers using Function Expression</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Sort Numbers (Function Expression)</h2>

    <label for="numbers">Enter numbers separated by commas:</label>
    <input type="text" id="numbers" placeholder="e.g., 45,12,89,33,5">

    <button onclick="sortNumbers()">Sort Numbers</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
