<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Functions with Default Values</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Rectangle Calculator (Nested Functions)</h2>
    <p>Enter values or leave blank to use defaults (Length = 5, Width = 3):</p>

    <label for="length">Length:</label>
    <input type="number" id="length" placeholder="Default: 5">

    <label for="width">Width:</label>
    <input type="number" id="width" placeholder="Default: 3">

    <button onclick="calculateRectangle()">Calculate</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
