<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Function with Default Parameters - Rectangle Area</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Rectangle Area Calculator</h2>
    <p>Leave fields empty to use default values.</p>

    <label for="length">Enter Length:</label>
    <input type="number" id="length" placeholder="Default: 5">

    <label for="width">Enter Width:</label>
    <input type="number" id="width" placeholder="Default: 3">

    <button onclick="calculateArea()">Calculate Area</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
