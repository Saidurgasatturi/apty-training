<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higher-Order Function with Arrow Callback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Higher-Order Function with Arrow Function</h2>
    <p>Filter numbers greater than a given limit using a callback.</p>

    <label for="numbers">Enter Numbers (comma-separated):</label>
    <input type="text" id="numbers" placeholder="e.g., 10, 20, 30, 40, 50">

    <label for="limit">Enter Limit:</label>
    <input type="number" id="limit" placeholder="e.g., 30">

    <button onclick="filterNumbers()">Filter Numbers</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
