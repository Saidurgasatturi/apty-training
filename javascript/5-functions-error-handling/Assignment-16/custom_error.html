<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Error Handling - Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>🔢 Calculator with Custom Error Handling</h2>

  <div class="container">
    <input type="text" id="num1" placeholder="Enter first number">
    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>
    <input type="text" id="num2" placeholder="Enter second number">
    <button onclick="calculate()">Calculate</button>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
