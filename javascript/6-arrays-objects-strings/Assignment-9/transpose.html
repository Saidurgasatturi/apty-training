<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transpose Matrix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>15. Multi-Dimensional Array Operations – Transpose Matrix</h2>

  <div class="container">
    <label>Enter Matrix (comma-separated rows):</label><br>
    <textarea id="matrixInput" rows="5" placeholder="Example: 1,2,3\n4,5,6\n7,8,9"></textarea><br>

    <button onclick="handleTranspose()">Transpose Matrix</button>

    <h3>Original Matrix:</h3>
    <pre id="originalOutput"></pre>

    <h3>Transposed Matrix:</h3>
    <pre id="transposedOutput"></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
