<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array Destructuring - Swap Values</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Swap Two Numbers Using Array Destructuring</h2>

  <div class="container">
    <label>Enter first number (a):</label><br>
    <input type="number" id="numA" placeholder="e.g. 10"><br><br>

    <label>Enter second number (b):</label><br>
    <input type="number" id="numB" placeholder="e.g. 20"><br><br>

    <button onclick="swapValues()">Swap Values</button>

    <h3>Result:</h3>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
