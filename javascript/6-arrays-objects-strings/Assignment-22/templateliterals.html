<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Literals Greeting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Greeting with Template Literals</h2>

    <label for="nameInput">Enter your name:</label><br>
    <input type="text" id="nameInput" placeholder="Enter your name"><br><br>

    <label for="ageInput">Enter your age:</label><br>
    <input type="number" id="ageInput" placeholder="Enter your age"><br><br>

    <button onclick="generateGreeting()">Generate Greeting</button>

    <h3>Output:</h3>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
