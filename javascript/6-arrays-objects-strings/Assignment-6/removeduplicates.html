<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Duplicates from Array</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Remove Duplicates from an Array</h2>

  <div class="container">
    <label>Enter Array Elements (comma separated):</label><br>
    <input type="text" id="arrayInput" placeholder="e.g. 1,3,2,2,3,4,4,3"><br><br>

    <button onclick="removeDuplicatesHandler()">Remove Duplicates</button>

    <h3>Result:</h3>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
