<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Array of Strings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Join Array of Words into a Sentence</h2>

  <div class="container">
    <input type="text" id="wordsInput" placeholder="Enter words separated by commas (e.g. hello,world,from,js)">
    <br><br>
    <button onclick="convertToSentence()">Convert</button>

    <h3>Result:</h3>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
