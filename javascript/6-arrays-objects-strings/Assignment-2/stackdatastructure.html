<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Data Structure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Stack Data Structure Implementation</h2>

  <div class="container">
    <input type="text" id="element" placeholder="Enter element to push">
    <br><br>
    <button onclick="pushElement()">Push</button>
    <button onclick="popElement()">Pop</button>
    <button onclick="peekElement()">Peek (Top)</button>
    <button onclick="checkEmpty()">Is Empty?</button>
    
    <h3>Stack Elements:</h3>
    <p id="stackDisplay">[ ]</p>

    <h3>Result:</h3>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
