<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Manipulation with Dynamic Keys</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>1. Object Manipulation with Dynamic Keys</h2>

  <div class="container">
    <label>Enter Key:</label>
    <input type="text" id="keyInput" placeholder="e.g. name">

    <label>Enter Value:</label>
    <input type="text" id="valueInput" placeholder="e.g. John">

    <button onclick="addToObject()">Add / Update Object</button>

    <h3>Current Object:</h3>
    <pre id="output"></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
