<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 2 – iFrame DOM Manipulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Accessing and Manipulating iFrame Elements</h2>
  <div id="controls">
    <button id="btnId">Change Color (By ID)</button>
    <button id="btnClass">Toggle Background (By Class)</button>
    <button id="btnTag">Change Span Text (By Tag)</button>
    <button id="btnName">Toggle Disable (By Name)</button>
    <button id="btnAttr">Add Custom Attribute (By QuerySelector)</button>
  </div>
  <iframe id="myFrame" width="100%" height="400px" style="border:1px solid #aaa;"></iframe>

  <div id="output" class="output"></div>

  <script src="script.js"></script>
</body>
