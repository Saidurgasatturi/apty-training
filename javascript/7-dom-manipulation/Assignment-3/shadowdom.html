<!DOCTYPE html>
<html lang="en">
<head>

  <title>Accessing & Manipulating Shadow DOM Elements</title>

      margin: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: royalblue;
      color: white;

    }
    button:hover {
