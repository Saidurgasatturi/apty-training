<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Numbers Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Prime Numbers Finder</h2>

    <div class="row">
      <label for="start">Enter Start Number:</label>
      <input type="number" id="start" placeholder="Start number">
    </div>

    <div class="row">
      <label for="end">Enter End Number:</label>
      <input type="number" id="end" placeholder="End number">
    </div>

    <div class="row">
      <button onclick="findPrimes()">Find Primes</button>
    </div>

    <div id="result">Result will appear here...</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
