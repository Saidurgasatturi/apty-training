<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramid Pattern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Pyramid Pattern Generator</h2>

    <div class="row">
      <label for="rows">Enter number of rows:</label>
      <input type="number" id="rows" placeholder="e.g., 5">
    </div>

    <div class="row">
      <button onclick="generatePyramid()">Generate Pyramid</button>
    </div>

    <pre id="result">Pattern will appear here...</pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
